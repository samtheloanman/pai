# Runs on the owner's own runner (dell-pai). Never on GitHub-hosted runners.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHON_IMAGE: python:3.12-slim@sha256:191083cdf6c7bda8c76158983163ead5d5cf7b77cf3033e805bb0f5296f51b4b
  NODE_IMAGE: node:24-slim@sha256:873f586f3794f52281bd039bf02c048a0be08fde619338f9941bad1eb6b34530

jobs:
  backend:
    runs-on: [self-hosted, pai-linux]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: {persist-credentials: false}
      - name: Backend tests
        run: prototype/app/run-tests.sh

  web:
    runs-on: [self-hosted, pai-linux]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: {persist-credentials: false}
      - name: Web tests and build
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e npm_config_cache=/tmp/npm
          -v "$PWD/prototype/web":/web -w /web "$NODE_IMAGE"
          sh -c "npm ci --no-audit --no-fund && npx vitest run && npx vite build --outDir /tmp/out"

  compose:
    runs-on: [self-hosted, pai-linux]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: {persist-credentials: false}
      - name: Compose files parse
        env: {PAI_VAULT_KEY: ci-placeholder, LITELLM_MASTER_KEY: ci-placeholder}
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f prototype/docker-compose.yml config -q
      - name: Shell scripts parse
        run: |
          for f in run.sh prototype/setup-pai-vpn-gateway.sh prototype/verify-vpn-tunnel.sh; do bash -n "$f"; done
          for f in prototype/scripts/install.sh prototype/scripts/pai-up prototype/scripts/pai-backup prototype/egress/entrypoint.sh; do
            if [ -f "$f" ]; then sh -n "$f"; fi
          done
