# Thin entrypoint onto the PAI stack in prototype/ (llama.cpp + LiteLLM + Speaches + app). There is one stack:
# edit prototype/docker-compose.yml, not this file.
#
# Start it with ./run.sh, which creates the vault key outside the repo and passes it as a Compose secret.
# Plain `docker compose up` here needs the key in the shell, so prefer: prototype/scripts/pai-up --profile local up -d
# All published ports bind to 127.0.0.1 (PRD OS-5). The project name matches what prototype/scripts/install.sh writes
# to prototype/.env, so both paths use the same volumes and the same vault.
name: ${COMPOSE_PROJECT_NAME:-pai-mvp}

include:
  - path: prototype/docker-compose.yml
