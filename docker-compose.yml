version: "3.8"

services:
  ollama:
    image: ollama/ollama:latest@sha256:1cabd20e1762a7a8444bf4a7110b346d923cd77ab6c97c984434140638c913ec
    container_name: pai-ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11435}:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  pai-os:
    build:
      context: ./prototype
      dockerfile: app/Dockerfile
    container_name: pai-os
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      - PORT=8088
      - LITELLM_URL=${LITELLM_URL:-http://ollama:11434}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-}
      - CHAT_MODEL=${CHAT_MODEL:-gemma3:4b}
      - DECIDE_MODEL=${DECIDE_MODEL:-gemma3:4b}
      - DATA_DIR=/data
      - PAI_VAULT_KEY=${PAI_VAULT_KEY:?run ./run.sh once: it creates your own vault key in .env}
    volumes:
      - pai_data:/data
    restart: unless-stopped

volumes:
  ollama_data:
  pai_data:
