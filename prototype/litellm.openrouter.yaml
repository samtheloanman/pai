# Cloud setup mode: chat goes to an OpenRouter free model; voice stays on the box.
# Interview answers leave the box in this mode.
model_list:
  - model_name: pai-chat
    litellm_params:
      model: openrouter/os.environ/OPENROUTER_MODEL
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: pai-decide
    litellm_params:
      model: openrouter/os.environ/OPENROUTER_MODEL
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: pai-stt
    litellm_params:
      model: openai/Systran/faster-whisper-small
      api_base: http://speaches:8000/v1
      api_key: none
    model_info:
      mode: audio_transcription
  - model_name: pai-tts
    litellm_params:
      model: openai/speaches-ai/Kokoro-82M-v1.0-ONNX
      api_base: http://speaches:8000/v1
      api_key: none
    model_info:
      mode: audio_speech
litellm_settings:
  telemetry: false
