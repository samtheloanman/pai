# Outbound door for LiteLLM. LiteLLM sits on a network with no route out; this proxy is its only way to the
# internet and it forwards to the hosts in allow.txt and nothing else. allow.txt is built at start from
# /shared/egress-allowlist.txt (written by the PAI app from the owner's provider settings) plus PAI_EGRESS_ALLOW.
http_port 3128
acl allowed dstdomain "/run/egress/allow.txt"
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports
http_access allow allowed
http_access deny all
cache deny all
via off
forwarded_for delete
pid_filename none
shutdown_lifetime 1 seconds
access_log stdio:/var/log/squid/access.log
